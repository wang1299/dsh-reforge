name: Bug report / 问题报告
description: A redacted minimal reproduction / 脱敏最小复现
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not upload keys, token URLs, full config, conversations, databases or snapshots. 请勿上传密钥、认证链接、完整配置、会话或数据库。疑似漏洞请先看 SECURITY.md。"
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: OS, Node, Python, DSH and exact dsh-reforge artifact
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal steps / 最小复现
      description: Use synthetic data; include the failed step and error category only.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual / 预期与实际
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私核对
      options:
        - label: I removed credentials, private paths/data and full logs. / 已去除凭据、私人路径与完整日志。
          required: true
