name: publish website
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'examples/customer-form/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'wang1299/dsh-reforge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: website
      - name: Build for the actual Pages URL
        run: npm run build
        working-directory: website
        env:
          WEBSITE_URL: ${{ steps.pages.outputs.base_url }}
      - run: npm run check
        working-directory: website
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked static artifact
        id: deployment
        uses: actions/deploy-pages@v4

