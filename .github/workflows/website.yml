name: website
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'examples/customer-form/**', 'package.json', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'examples/customer-form/**', 'package.json', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check root hosting
        run: npm run build && npm run check
        env:
          WEBSITE_URL: https://example.invalid/
      - name: Build and check project subpath hosting
        run: npm run build && npm run check
        env:
          WEBSITE_URL: https://example.invalid/dsh-reforge/
